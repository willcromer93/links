<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --text:#0f172a; --muted:#5b6478;
    --border:#e2e6ef; --accent:#2563eb; --accent-2:#0ea5e9; --hover:#eef3ff;
    --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1220; --card:#131c2e; --text:#e8edf7; --muted:#9aa6bd;
      --border:#222e45; --accent:#60a5fa; --accent-2:#38bdf8; --hover:#1a2640;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.45;
    display:flex; justify-content:center;
    padding:max(40px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));
  }
  main{width:100%; max-width:440px; display:flex; flex-direction:column; align-items:center}
  .avatar{
    width:96px;height:96px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:34px;letter-spacing:.5px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover}
  h1{font-size:24px;font-weight:700;margin-top:16px;letter-spacing:-.01em}
  .role{color:var(--muted);font-size:15px;margin-top:4px;text-align:center}
  .loc{color:var(--muted);font-size:13px;margin-top:6px;display:flex;align-items:center;gap:6px}
  .links{list-style:none;width:100%;margin-top:28px;display:flex;flex-direction:column;gap:12px}
  .link{
    display:flex;align-items:center;gap:14px;width:100%;
    padding:14px 16px;min-height:64px;
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    color:var(--text);text-decoration:none;box-shadow:var(--shadow);
    transition:transform .12s ease, background .12s ease, border-color .12s ease;
  }
  .link:hover{background:var(--hover);border-color:var(--accent)}
  .link:active{transform:scale(.985)}
  .link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .icon{
    flex:0 0 40px;height:40px;border-radius:10px;display:grid;place-items:center;
    background:var(--hover);color:var(--accent);
  }
  .icon svg{width:22px;height:22px}
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-size:16px;font-weight:600}
  .txt span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chev{color:var(--muted);flex:0 0 auto}
  .link.primary{border-color:var(--accent)}
  .social{display:flex;gap:10px;margin-top:24px}
  .social a{
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    background:var(--card);border:1px solid var(--border);color:var(--muted);
  }
  .social a:hover{color:var(--accent);border-color:var(--accent)}
  .social svg{width:20px;height:20px}
  .save{
    margin-top:24px;width:100%;max-width:320px;height:52px;border-radius:999px;
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
    font-size:16px;font-weight:600;text-decoration:none;box-shadow:var(--shadow);
    transition:transform .12s ease, filter .12s ease;
  }
  .save:hover{filter:brightness(1.08)}
  .save:active{transform:scale(.98)}
  .save:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .save svg{width:20px;height:20px}
  footer{margin-top:32px;font-size:12px;color:var(--muted)}
</style>
